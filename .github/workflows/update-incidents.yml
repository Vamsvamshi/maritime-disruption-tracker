name: Update Incident Data

on:
  schedule:
    - cron: '0 6,14,22 * * *'   # 06:00, 14:00, 22:00 UTC (3× daily)
  workflow_dispatch:        # allow manual trigger from the Actions tab

permissions:
  contents: write           # needed to commit the updated JSON

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          # no cache: pip — fetch_incidents.py uses only stdlib

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch new incidents
        run: python scripts/fetch_incidents.py

      - name: Update analytics feed
        run: node scripts/update_analytics_feed.js

      - name: Validate analytics dashboard data
        run: node scripts/validate_analytics.js

      - name: Commit updated data (if changed)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/incidents.json data/analytics_dashboard.json
          if git diff --cached --quiet; then
            echo "No changes — nothing to commit."
          else
            git commit -m "chore(data): update dashboard data $(date -u +%Y-%m-%d)"
            git push
          fi
